# Minimal single-container arena stack (Mode A — Docker).
# Suitable for self-hosting.  No Postgres, no Kafka — uses SQLite.
#
# Usage:
#   cp .env.example .env   # set SECRET_KEY, FIRST_SUPERUSER, etc.
#   docker compose -f docker-compose.arena.yml up -d
#
# The static frontend is served by FastAPI at /.
# The API lives at /api/v1/.

services:
  arena:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: /api/v1
        ASTRO_BASE: /
        ASTRO_SITE: http://localhost:8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - arena-data:/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-changeme-in-production}
      - FIRST_SUPERUSER=${FIRST_SUPERUSER:-admin@example.com}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-changeme}
      - ARENA_DB_PATH=/data/arena.db
      - ENVIRONMENT=${ENVIRONMENT:-local}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  arena-data:
