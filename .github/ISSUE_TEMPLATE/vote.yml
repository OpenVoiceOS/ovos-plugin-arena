name: "Arena Vote"
description: "Cast a vote in an OVOS Plugin Arena blind battle. Do not modify the title — it is machine-parsed."
labels:
  - vote
title: "vote|<battle_id>|<a|b|tie|both_wrong>"
body:
  - type: markdown
    attributes:
      value: |
        **Submit this issue as-is — do not edit the title.**

        The arena UI pre-filled the title in the format `vote|<battle_id>|<choice>`.
        A scheduled GitHub Action reads all `vote`-labelled issues, deduplicates
        (one vote per user per battle), replays ELO and updates the leaderboards.
        Your vote becomes part of the public, auditable vote log.
  - type: textarea
    id: comment
    attributes:
      label: Comment (optional)
      description: Anything worth noting about this battle — e.g. why both candidates were wrong.
    validations:
      required: false
