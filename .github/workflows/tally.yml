name: Tally votes

on:
  schedule:
    # Hourly: process vote issues and update the ELO leaderboards.
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: arena-data
  cancel-in-progress: false

jobs:
  tally:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install arena
        run: pip install --quiet .

      - name: Tally votes and regenerate ELO leaderboards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m arena.cli tally \
            --data-dir frontend-static/public/data \
            --output frontend-static/public/data \
            --repo "${GITHUB_REPOSITORY}"

      - name: Update data index
        run: |
          python -m arena.cli export-index \
            --data-dir frontend-static/public/data \
            --output frontend-static/public/data/index.json

      - name: Commit updated leaderboards
        run: |
          git config user.name "JarbasAi"
          git config user.email "jarbasai@mailfence.com"
          git add frontend-static/public/data/
          if git diff --cached --quiet; then
            echo "No leaderboard changes."
          else
            git commit -m "chore(data): update leaderboards from vote tally [skip ci]"
            git push origin dev
          fi
