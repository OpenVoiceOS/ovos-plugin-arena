name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'frontend-static/**'
      - '.github/workflows/pages.yml'
  # Redeploy after a data refresh: assemble/tally commit with [skip ci], so a
  # push trigger never fires for them — deploy on their completion instead.
  workflow_run:
    workflows: ["Assemble battles", "Tally votes"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-static/package-lock.json

      - name: Install Astro dependencies
        run: |
          cd frontend-static
          npm ci

      - name: Build static site
        env:
          ASTRO_SITE: ${{ vars.ASTRO_SITE || 'https://openvoiceos.github.io' }}
          ASTRO_BASE: ${{ vars.ASTRO_BASE || '/ovos-plugin-arena' }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO || github.repository }}
        run: |
          cd frontend-static
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend-static/dist

  # GitHub Pages on free plans requires a public repository.  The deploy job
  # skips itself while the repo is private (the build job above still
  # validates the site).  Once public: Settings → Pages → Source = "GitHub
  # Actions", then this deploys on every data refresh.
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
