name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
    paths:
      - 'frontend-static/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

# IMPORTANT: GitHub Pages deployment is disabled while the repo is private.
# To enable:
#   1. Make the repo public (Settings → Change visibility) OR enable private Pages
#      (requires GitHub Enterprise / Teams).
#   2. In Settings → Pages, set Source to "GitHub Actions".
#   3. Uncomment the `deploy` job below.
#   4. Set ASTRO_SITE / ASTRO_BASE repo variables to match your Pages URL.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend-static/package-lock.json

      - name: Install Astro dependencies
        run: |
          cd frontend-static
          npm ci

      - name: Build static site
        env:
          ASTRO_SITE: ${{ vars.ASTRO_SITE || 'https://openvoiceos.github.io' }}
          ASTRO_BASE: ${{ vars.ASTRO_BASE || '/ovos-plugin-arena' }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO || github.repository }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || '' }}
        run: |
          cd frontend-static
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-static/dist

  # Uncomment this job once the repo is public and Pages source is set to "GitHub Actions":
