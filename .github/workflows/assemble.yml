name: Assemble battles

on:
  schedule:
    # Daily battles-pool + benchmark-board refresh from HF prediction datasets.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      max_battles:
        description: 'Max battles per (modality, dataset, lang) pool'
        required: false
        default: '200'

permissions:
  contents: write

jobs:
  # One matrix leg per modality (arena.registry.schemas.Modality). Each leg
  # only resolves+downloads its own modality's HF prediction repos —
  # arena.cli.cmd_assemble scopes registry.loaders.list_prediction_repos()
  # to --modality when given, instead of the pre-fix behavior of touching
  # every registry prediction repo (~120, across every modality) on EVERY
  # assemble invocation regardless of scope. Sharding by modality on top of
  # that fix turns the remaining, unavoidable per-repo HF round trips into
  # independent, parallel legs instead of one multi-hour sequential run —
  # the failure mode that left the daily boards frozen (hosted-runner
  # eviction on the unsharded job: "The operation was canceled" / "runner
  # lost communication"). fail-fast: false so one modality's HF hiccup
  # never cancels the others.
  assemble:
    runs-on: ubuntu-latest
    # The intent leg walks every language of every intent dataset
    # (~50 languages x 5 datasets) and takes just under an hour on a
    # hosted runner; the daily cron is 24h apart, so a generous cap costs
    # nothing and a tight one silently drops the leg's whole board refresh.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        modality:
          - stt
          - tts
          - wake_word
          - vad
          - intent
          - ww_stream
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install arena
        run: pip install --quiet ".[hf]"

      - name: Assemble ${{ matrix.modality }} battles, benchmark boards and ELO seeds
        env:
          MAX_BATTLES: ${{ inputs.max_battles || '200' }}
        run: |
          echo "::group::assemble --modality ${{ matrix.modality }}"
          start=$(date +%s)
          python -m arena.cli assemble \
            --output frontend-static/public/data \
            --modality "${{ matrix.modality }}" \
            --max-battles "${MAX_BATTLES}"
          echo "assemble(${{ matrix.modality }}) wall clock: $(( $(date +%s) - start ))s"
          echo "::endgroup::"

      # Scoped to this leg's own filenames — arena.cli.cmd_assemble names
      # every board/battle-pool/ELO artifact "<kind>-<modality>-...json"
      # (battle_group() is an identity mapping, so a leg's own modality is
      # never any other leg's group — see arena/models.py battle_group),
      # so legs never collide and a plain glob is enough to shrink the
      # artifact to just what this leg touched. assemble-summary-<modality>.json
      # (§alarms — unregistered-competitor report plus the unranked-board/
      # off-revision alarms) is named per modality the same way, since
      # download-artifact's merge-multiple below overwrites same-named
      # files across artifacts: an unscoped assemble-summary.json here
      # would keep only one leg's alarms. The commit job below merges
      # every leg's file back into one.
      - name: Upload data delta
        uses: actions/upload-artifact@v7
        with:
          name: arena-data-${{ matrix.modality }}
          path: |
            frontend-static/public/data/*-${{ matrix.modality }}-*.json
            frontend-static/public/data/assemble-summary-${{ matrix.modality }}.json
          if-no-files-found: ignore
          retention-days: 1

  # Serialized on purpose (needs: assemble, plus the arena-data concurrency
  # group below) — every matrix leg's artifacts merge into the SAME working
  # tree and this job makes the single data commit for the whole run, same
  # as the pre-sharding single-job design.
  #
  # This job-level group is the ONLY concurrency declaration in this
  # workflow — deliberately. A WORKFLOW-level `concurrency: group:
  # arena-data` used to sit at the top of this file, which put every
  # still-running matrix leg (not just this commit job) inside the same
  # group as tally.yml's single job. Runs 33404190154 (assemble, single-job
  # era) and 33414447333 (assemble, matrix era) both had a leg killed with
  # "The operation was canceled" while still executing, well before its
  # 50-minute timeout, in the same minute a same-group Tally votes run was
  # being resolved (dispatched 16:47:08, held pending, and only cancelled
  # at 17:01:11 — right as this run's `commit` job, itself requesting group
  # arena-data, and the `assemble (intent_template)` leg were finishing at
  # 17:00:16-19). With workflow-level concurrency, the whole run — matrix
  # legs included — is a member of the group for its entire lifetime, so a
  # second, unrelated run (or job) contending for that same group can pull
  # in-flight legs into the group's scheduling/eviction decision even
  # though cancel-in-progress is false. Only the job that actually needs to
  # serialize (the commit, which pushes to dev) should be in the group;
  # matrix legs must never share a concurrency group with anything.
  commit:
    needs: assemble
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: arena-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install arena
        run: pip install --quiet ".[hf]"

      - name: Download every modality's data delta
        uses: actions/download-artifact@v8
        with:
          pattern: arena-data-*
          path: frontend-static/public/data
          merge-multiple: true

      # download-artifact --merge-multiple only adds/overwrites files onto
      # this checkout — it can never delete a file a leg's own in-run prune
      # removed from that leg's ephemeral runner workspace, so a deletion
      # never reaches this checkout on its own. Run the standalone prune
      # once here, over the fully merged data dir, before the exports below
      # read it. Registry-derived, no network needed.
      - name: Prune stale artifacts across every merged modality
        run: |
          python -m arena.cli prune-data \
            --registry registry \
            --data-dir frontend-static/public/data

      # Each matrix leg only ever holds its own modality's fresh seeds, so
      # the leaderboards and vote-audit.json it derives describe a partial
      # roster, and vote-audit.json has no modality in its name to be
      # uploaded by anyway. Replay once here, over the fully merged seeds,
      # so every artifact the replay proof compares comes from one run of
      # the shared path. Records nothing and touches no network: no
      # --repo. The legs' boards are dropped first so the patch-note diff
      # is against what dev published, not against a board this run has
      # already rewritten; the replay reproduces them exactly. The restore
      # goes through `git ls-files` because a leg can publish a board for
      # a (modality, lang) dev has never had: a shell glob would hand git
      # that untracked path too, and git rejects the whole pathspec, which
      # under `bash -e` would take the run's data commit with it.
      - name: Replay the vote record over the merged seeds
        run: |
          git ls-files -z -- 'frontend-static/public/data/leaderboard-*.json' \
            | git checkout --pathspec-from-file=- --pathspec-file-nul
          python -m arena.cli tally \
            --data-dir frontend-static/public/data \
            --output frontend-static/public/data

      - name: Export bestiary and data index
        run: |
          python -m arena.cli export-bestiary \
            --registry registry \
            --output frontend-static/public/data/competitors.json
          python -m arena.cli export-index \
            --data-dir frontend-static/public/data \
            --output frontend-static/public/data/index.json
          python -m arena.cli export-evidence \
            --registry registry \
            --data-dir frontend-static/public/data \
            --spec docs/SPECIFICATION.md \
            --output frontend-static/public/data/evidence.json

      # Each leg uploaded its own assemble-summary-<modality>.json (see the
      # "Upload data delta" step above) — reduce them to the single
      # assemble-summary.json the alarm step below reads, unioning boards
      # and summing counters instead of letting merge-multiple pick one
      # leg's file arbitrarily.
      - name: Merge per-modality assemble summaries
        run: |
          python -m arena.cli merge-assemble-summaries \
            --data-dir frontend-static/public/data

      # arena.cli.cmd_assemble only writes an assemble-summary file when it
      # has something to report (docs/operations.md "Alarms") — a board
      # every fighter came back unranked on, or rows dropped for being
      # swept against the wrong dataset revision. Both are legitimate
      # states while a re-sweep is in flight, so the run still publishes;
      # the annotation is the whole point of running this step.
      - name: Alarm on assemble-summary.json (unranked boards, off-revision rows)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("frontend-static/public/data/assemble-summary.json")
          if not path.exists():
              raise SystemExit(0)
          summary = json.loads(path.read_text())

          boards = summary.get("boards_without_ranked_fighters") or []
          for board in boards:
              print(f"::warning::assemble: every fighter is unranked on {board} "
                    "— boards a re-sweep will fix, not a build failure")

          no_negatives = summary.get("boards_without_negatives") or []
          for board in no_negatives:
              print(f"::warning::assemble: {board} has no negative (false-accept) "
                    "rows — false_accept_rate/fa_per_hour cannot be measured "
                    "until a negatives corpus is swept for this board")

          unmanaged_on_error = summary.get("boards_unmanaged_on_error") or []
          for board in unmanaged_on_error:
              print(f"::warning::assemble: {board} scored unfiltered because "
                    "its sample_sets manifest failed to load (not just "
                    "unpublished — the fetch or parse itself errored, see the "
                    "assemble job log) — fix the loader or republish the "
                    "manifest, then re-run assemble")

          dropped = summary.get("rows_dropped_off_revision") or 0
          if dropped:
              print(f"::warning::assemble: {dropped} row(s) dropped for being "
                    "swept against a dataset revision other than the one the "
                    "registry pins")
          PY

      - name: Commit updated data
        run: |
          git config user.name "JarbasAi"
          git config user.email "jarbasai@mailfence.com"
          git add frontend-static/public/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh battles pool and benchmark boards [skip ci]"
            # dev can move under a long matrix run (other merges, another
            # scheduled run). Data commits only ever touch
            # frontend-static/public/data/, so a rebase onto a moved dev is
            # safe — retry push-then-rebase up to 3 times before giving up.
            attempt=1
            until git push origin dev; do
              if [ "$attempt" -ge 3 ]; then
                echo "push failed after $attempt attempts" >&2
                exit 1
              fi
              echo "push rejected (dev moved) — rebasing, attempt $attempt/3"
              git pull --rebase origin dev
              attempt=$(( attempt + 1 ))
            done
          fi

  # See docs/operations.md "Alarms" — a red assemble run silently absorbed
  # under a green badge is exactly what left the daily boards frozen before
  # anyone noticed (see the matrix-sharding note on the assemble job above).
  #
  # Neither `assemble` (no job-level `if:`, matrix legs failing/succeeding
  # is reflected as the job's own success/failure, never a skip) nor
  # `commit` (`if: always()`) can actually be skipped today, but the
  # explicit `needs.<job>.result` check plus `always()` is used anyway so
  # this workflow can never regress into the "skipped need silently blocks
  # both notify jobs" trap a bare `success()`/`failure()` hides (see the
  # same note on replay-proof.yml's notify jobs, the one that actually hit
  # it in run 34040895690).
  notify-on-failure:
    needs: [assemble, commit]
    if: always() && (needs.assemble.result == 'failure' || needs.commit.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/notify-failure
        with:
          title: "CI: Assemble battles failing"
          mode: open

  notify-on-success:
    needs: [assemble, commit]
    if: always() && needs.assemble.result == 'success' && needs.commit.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/notify-failure
        with:
          title: "CI: Assemble battles failing"
          mode: close
