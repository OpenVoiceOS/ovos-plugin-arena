name: Assemble battles

on:
  schedule:
    # Run daily at 03:00 UTC to refresh the battles pool from HF datasets.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      modality:
        description: 'Modality to assemble (leave empty for all)'
        required: false
        default: ''
      max_battles:
        description: 'Max battles per modality (default: 200)'
        required: false
        default: '200'

jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -e ".[dev]" --quiet 2>&1 | tail -5

      - name: Run assembler CLI
        env:
          HF_DATASETS: ${{ vars.HF_DATASETS || 'OpenVoiceOS/ovos-stt-bench-pt-PT' }}
          MODALITY: ${{ inputs.modality || '' }}
          MAX_BATTLES: ${{ inputs.max_battles || '200' }}
        run: |
          python -m arena.cli assemble \
            --hf-datasets "${HF_DATASETS}" \
            --output frontend-static/public/data \
            ${MODALITY:+--modality "$MODALITY"} \
            --max-battles "${MAX_BATTLES}"

      - name: Update data index
        run: |
          python -m arena.cli export-index \
            --data-dir frontend-static/public/data \
            --output frontend-static/public/data/index.json

      - name: Commit updated data
        run: |
          git config user.name "JarbasAi"
          git config user.email "jarbasai@mailfence.com"
          git add frontend-static/public/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh battles pool [skip ci]"
            git push origin dev
          fi
