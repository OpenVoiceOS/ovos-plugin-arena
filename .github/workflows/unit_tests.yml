name: Unit Tests

on:
  push:
    branches: [dev]
    paths:
      - 'arena/**'
      - 'registry/**'
      - 'runner/**'
      - 'benchmarks/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/unit_tests.yml'
  pull_request:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      install_extras: "test"
      test_path: "tests/"
