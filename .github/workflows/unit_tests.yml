name: Unit Tests

on:
  push:
    branches: [dev]
    paths:
      - 'arena/**'
      - 'registry/**'
      - 'runner/**'
      - 'benchmarks/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/unit_tests.yml'
  pull_request:
    branches: [dev]
  workflow_dispatch: {}

jobs:
  validate_registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install .
      - run: python -m arena.cli validate-registry --registry registry

  build_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      install_extras: "test,audio,hf"
      test_path: "tests/"

  lint:
    uses: OpenVoiceOS/gh-automations/.github/workflows/lint.yml@dev
    with:
      ruff_args: "."

  type_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/type-check.yml@dev
    with:
      mypy_args: "arena registry"
      test_extras: "lint"
      test_extras_fallback: "test"
