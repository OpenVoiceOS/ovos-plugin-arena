[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-plugin-arena"
description = "Blind A/B evaluation and benchmark leaderboards for OpenVoiceOS plugins"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dynamic = ["version"]
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"},
]
keywords = ["ovos", "openvoiceos", "benchmark", "elo", "arena", "intent", "stt", "tts", "wake-word"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-plugin-arena"

[project.optional-dependencies]
# HuggingFace prediction dataset ingestion (assemble CLI, runners)
hf = [
    "huggingface_hub>=0.24",
    "datasets>=2.20",
    "requests",
]
# Audio-modality benchmarks (STT / wake word / TTS): decode + stream clips.
# The STT/TTS/wake-word OVOS plugins themselves are installed separately.
audio = [
    "numpy",
    "soundfile",
    "pyarrow>=14",
    "speechonnxmetrics>=0.0.1a1",
    # faster-whisper stays ONLY for its decode_audio resample fallback in
    # runner/audio_io.py / runner/plugin_runner.py — the intelligibility
    # judge itself is per-language onnx-asr (runner/asr_judges.py, §4 R16).
    "faster-whisper",
    "onnx-asr[cpu,hub]",
    # Holds the per-language ASR registry runner/asr_judges.py reads to
    # decide which languages can be judged for intelligibility at all.
    "ovos-stt-plugin-onnx-asr>=0.6.0a1",
    # WakeWordProbe (per-clip hotword driver, PR ovoscope#97) landed in
    # 1.6.0a1; not yet in a stable ovoscope release (latest stable is 1.5.0),
    # so this is a prerelease floor pin, not a stable-release requirement.
    "ovoscope>=1.6.0a1",
    # Plain pip resolves ovoscope's floor-only ovos-core pin down to
    # ovos-core 2.1.5a1, whose lgpl extra needs the libfann-backed
    # ovos_padatious<2.0.0 (fann2 has no wheel and fails to build). Pin the
    # libfann-free line explicitly; stable ovos-padatious still needs fann2.
    "ovos-core>=3.2.0a1",
    "ovos-padatious>=2.0.17a1",
    # runner/intent_pipeline.py strips OVOS-INTENT-1 §3.4 typed-slot
    # prefixes (e.g. {color:shade}) from training templates before they
    # reach any engine, same as ovos-workshop's own loader.
    "ovos-spec-tools>=1.11.0a1",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-timeout>=2.3",
    "huggingface_hub>=0.24",
    "requests",
    "numpy",
    # test_tts_bench.py's RealWavEngine and the audio decode path it
    # exercises (runner/audio_io.py) read/write real wav/mp3 clips, and
    # decode_audio_bytes' resample step falls back to faster-whisper's
    # decode_audio for non-target sample rates.
    "soundfile",
    "faster-whisper",
    # The wake-word adapter tests exercise the real ovoscope WakeWordProbe
    # (runner/ww_bench.py) — tests must fail loudly, never skip, on missing
    # deps, so the probe dependency belongs in the test extra too.
    "ovoscope>=1.6.0a1",
    # The judge-availability tests assert runner/asr_judges.py agrees with
    # the plugin's real LANG_DEFAULTS registry, so they import it — same
    # never-skip reasoning as ovoscope above.
    "ovos-stt-plugin-onnx-asr>=0.6.0a1",
    # ovos-stt-plugin-onnx-asr depends on onnx-asr without its cpu/gpu
    # extra, so onnxruntime is never pulled in; the test extra must be
    # self-sufficient without the audio extra.
    "onnx-asr[cpu,hub]",
    # test_intent_pipeline.py exercises the typed-slot stripping choke
    # point directly, so the test extra needs it self-sufficiently too.
    "ovos-spec-tools>=1.11.0a1",
    # The intent-transformer tests (tests/test_intent_pipeline.py::
    # TestIntentTransformers) exercise the real kw-template-matcher plugin
    # against both the legacy padatious:register_intent topic and the
    # OVOS-INTENT-4 ovos.intent.register.template spec topic; 0.1.6a1 is
    # the floor that binds the spec topic.
    "keyword-template-matcher>=0.1.6a1",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
ovos-arena = "arena.cli:main"
ovos-arena-queue = "runner.queue_tools:main"

[tool.setuptools]
packages = ["arena", "registry", "runner"]

[tool.setuptools.dynamic]
version = {attr = "arena.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit external services (HuggingFace, GitHub)",
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["frontend-static", "predictions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B017"]  # pydantic raises plain ValidationError/ValueError in tests; pytest.raises(Exception) is intentional

[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arena.elo", "arena.models", "registry.schemas"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["runner.*"]
ignore_errors = true

[tool.coverage.run]
source = ["arena", "registry", "runner"]
omit = ["runner/migrate/*", "benchmarks/*"]

[tool.coverage.report]
fail_under = 56
